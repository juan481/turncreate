name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  app:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  deploy:
    name: Build y deploy a producción
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Si los 3 secrets todavía no se cargaron, el resto de los pasos se
      # saltea y el job queda en VERDE (no rojo) -- antes, sin secrets,
      # este job fallaba en cada push y le mandaba un mail de "CI falló" a
      # cada rato aunque TurnCreate siguiera andando bien (el deploy real
      # se estaba haciendo a mano). Una vez cargados VPS_SSH_KEY, VPS_HOST
      # y VPS_USER en Settings > Secrets and variables > Actions, el
      # deploy automático arranca solo, sin tocar nada más acá.
      - name: Chequear si los secrets de deploy están cargados
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy automático todavía no configurado (faltan VPS_SSH_KEY / VPS_HOST / VPS_USER) -- se omite, no es un error. El deploy se está haciendo a mano mientras tanto."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
      # Build e instalación completos en el runner de GitHub (Linux, mismo
      # SO que el VPS) -- nunca en el VPS: evita que un build pesado le
      # saque RAM a los otros 5 sitios que corren en la misma máquina.
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      - run: npm run build
        if: steps.check.outputs.configured == 'true'
      # Node_modules de producción recortado DEL MISMO árbol que compiló
      # (prune solo borra nodos del lockfile ya resuelto, no vuelve a
      # resolver nada) -- así el runtime usa exactamente la misma
      # resolución de paquetes externos (firebase-admin, etc.) que usó
      # Turbopack al generar .next/server, que es justo lo que se rompía
      # cuando el build y el `npm install` del VPS se hacían por separado.
      - run: npm prune --omit=dev
        if: steps.check.outputs.configured == 'true'
      - name: Deploy por rsync + restart de PM2
        if: steps.check.outputs.configured == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Verificando formato de la clave privada..."
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::VPS_SSH_KEY no es una clave privada SSH válida (¿se pegó completa, con BEGIN/END?)"; exit 1; }

          echo "Agregando $VPS_HOST a known_hosts..."
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1 | tee /tmp/keyscan.log
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan no devolvió nada -- revisá que VPS_HOST sea correcto y el puerto 22 esté abierto"; exit 1; }

          echo "Probando conexión SSH..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" "echo conexión OK desde GitHub Actions" \
            || { echo "::error::No se pudo conectar por SSH -- revisá que la clave pública de VPS_SSH_KEY esté en ~/.ssh/authorized_keys de $VPS_USER@$VPS_HOST"; exit 1; }

          echo "Sincronizando archivos..."
          rsync -az --delete \
            --exclude='.env' --exclude='.git' --exclude='.next/cache' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$VPS_USER@$VPS_HOST:/root/turncreate/"

          echo "Reiniciando PM2..."
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "pm2 restart turncreate"
